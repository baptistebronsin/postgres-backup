services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"

  backup:
    build: .
    environment:
      DB_HOST: database
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: database
      S3_ENDPOINT: 
      S3_ACCESS_TOKEN: 
      S3_SECRET_ACCESS_TOKEN: 
      S3_BUCKET: 
      # BACKUP_COMPRESSION: 
      # BACKUP_AGE_RECIPIENT: 
    depends_on:
      - database