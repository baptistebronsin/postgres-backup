services:
  database:
    image: postgres:18.4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"

  migration:
    image: ghcr.io/plannify-truck-driver/common-services:0.1.18
    environment:
      - DATABASE_URL=postgresql://user:password@database:5432/database
    depends_on:
      - database

  backup:
    build: .
    environment:
      DB_HOST: database
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: database
      S3_ENDPOINT:
      S3_ACCESS_TOKEN:
      S3_SECRET_ACCESS_TOKEN:
      S3_BUCKET:
      # BACKUP_COMPRESSION:
      # BACKUP_AGE_RECIPIENT:
    depends_on:
      - database
